# nginx-rtmp keeps its session/stat/control state per worker process, so
# a stream published to one worker is invisible to /stat, /control, and
# rtmp_control on any other - this has to stay 1.
worker_processes  1;

events {
    worker_connections  1024;
}

error_log  /dev/stderr warn;

rtmp {
    # rendered per-container from templates/rtmp-site.conf.template by
    # docker-entrypoint.sh — one file, named after $DOMAIN
    include rtmp.d/*.conf;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;

    # stream_keys.map holds one "<stream_key>" <playback_id>; line per
    # minted key (see mint-key.sh) on a persistent volume, so keys survive
    # container restarts. The encoder publishes to
    # stream/<playback_id>?key=<stream_key> - nginx-rtmp splits that into
    # $name (playback_id) and $arg_key (the secret) on its own, so
    # /auth/publish just has to look $arg_key up here and check it's
    # allowed to claim the $name being published as. `nginx -s reload`
    # re-reads this file with no dropped connections, so minting/revoking
    # a key never requires a restart.
    map $arg_key $keyed_playback_id {
        include /data/stream_keys.map;
        default "";
    }

    # rendered per-container from templates/http-site.conf.template
    include conf.d/*.conf;
}
