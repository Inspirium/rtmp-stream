services:
  rtmp:
    # Prebuilt by .github/workflows/docker-publish.yml on every push to
    # master, since the Dockerfile compiles nginx from source (slow).
    # Fast deploy path: `docker compose pull && docker compose up -d`.
    # Building locally (e.g. testing a Dockerfile change) still works
    # with `docker compose up -d --build`, which overrides this image
    # tag with a local build of the same name.
    image: ghcr.io/inspirium/rtmp-stream:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${RTMP_PORT:-1935}:1935"
    volumes:
      - rec-data:/tmp/rec
      - key-data:/data

volumes:
  rec-data:
  key-data:
